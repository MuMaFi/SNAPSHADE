plugins { id 'com.android.application' }

android {
  namespace 'net.foundtape.app'
  compileSdk 34

  defaultConfig {
    applicationId "net.foundtape.app"
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }

  /* Eigener Schlüssel statt des Android-Debug-Schlüssels. Damit ist die APK
     eine reguläre Release-Fassung: nicht debuggbar, gleichbleibende Signatur
     (Updates lassen sich also drüberinstallieren) und Play Protect stuft sie
     deutlich freundlicher ein. Passwort und Pfad lassen sich über
     Umgebungsvariablen überschreiben, wenn der Schlüssel nicht im Repo
     liegen soll. */
  signingConfigs {
    release {
      storeFile     file(System.getenv('FT_KEYSTORE')      ?: '../keystore/foundtape.jks')
      storePassword System.getenv('FT_KEYSTORE_PASSWORD')  ?: 'foundtape'
      keyAlias      System.getenv('FT_KEY_ALIAS')          ?: 'foundtape'
      keyPassword   System.getenv('FT_KEY_PASSWORD')       ?: 'foundtape'
      // Alle Signaturverfahren mitgeben: ältere Android-Fassungen prüfen v1/v2,
      // neuere v3, und v4 erlaubt die schnelle Installation über adb.
      enableV1Signing = true
      enableV2Signing = true
      enableV3Signing = true
      enableV4Signing = true
    }
  }

  buildTypes {
    debug {
      // Das Spiel liegt komplett in den Assets, es wird nichts nachgeladen.
      minifyEnabled false
    }
    release {
      minifyEnabled false
      debuggable false
      signingConfig signingConfigs.release
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
