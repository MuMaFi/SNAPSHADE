plugins { id 'com.android.application' }

android {
  namespace 'net.foundtape.app'
  compileSdk 34

  defaultConfig {
    applicationId "net.foundtape.app"
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    debug {
      // Das Spiel liegt komplett in den Assets, es wird nichts nachgeladen.
      minifyEnabled false
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
